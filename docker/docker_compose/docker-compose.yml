version: "3.8"

services:
  node:
    build: ./../docker_node
    # volumes:
    #   - ./../data/uploads:/usr/src/app/uploads
    #   - ./../data/config:/usr/src/app/config
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://simon:simon@postgis:5432/chenes
    depends_on:
      - postgis
    networks:
      - appnet

  postgis:
    container_name: simon-postgis
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: simon
      POSTGRES_PASSWORD: simon
      POSTGRES_DB: chenes
    volumes:
      - postgis_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - appnet

  shiny:
    build: ./../docker_shiny
    container_name: shiny-arbres
    ports:
      - "3838:3838"
    depends_on:
      - node
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    driver: bridge

volumes:
  postgis_data: